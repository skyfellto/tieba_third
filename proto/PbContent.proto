syntax = "proto3";

package tieba;

option java_package = "com.huanchengfly.tieba.post.api.models.protos";

import "MemeInfo.proto";

message PbContent {
  int32 type = 1;
  string text = 2;
  string link = 3;
  string src = 4;
  string bsize = 5;
  string bigSrc = 6;
  string bigSize = 7;
  string cdnSrc = 8;
  string bigCdnSrc = 9;
  string imgType = 10;
  string c = 11;
  string voiceMD5 = 12;
  uint32 duringTime = 13;
  int64 uid = 15;
  string dynamic = 16;
  string _static = 17;
  uint32 width = 18;
  uint32 height = 19;
  string packet_name = 20;
  string phonetype = 21;
  uint32 is_native_app = 22;
  uint32 e_type = 24;
  string originSrc = 25;
  uint32 btn_type = 26;
  uint32 originSize = 27;
  int32 count = 28;
  string mediaSubtitle = 31;
  int32 urlType = 32;
  MemeInfo memeInfo = 33;
  uint32 isLongPic = 34;
  uint32 showOriginalBtn = 35;
  string cdnSrcActive = 36;
  string topic_special_icon = 37;
  uint64 item_id = 38;
  string item_forum_name = 39;
  int64 pic_id = 42;
  int32 link_type = 43;
  string target_scheme = 44;
  string query_text = 46;
  string query_prefix = 47;
  string icon = 48;
  string portrait = 49;
  int32 search_type = 51;
  int32 is_bot = 52;
}